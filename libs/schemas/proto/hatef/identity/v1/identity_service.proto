// Internal gRPC contract for the Hatef Identity Platform.
//
// IdentityService is consumed by other Hatef microservices (e.g. the Email
// Service and Search Core) strictly over mTLS with SPIFFE/SPIRE identities
// (see architecture.md "Inter-Service Communication" and client-integration.md
// §3.3). Every RPC is method-level RBAC gated on the caller's SPIFFE ID.
//
// Decisions are point-in-time; consumers must not cache successful validation
// or permission responses until the token's expiry.
syntax = "proto3";

package hatef.identity.v1;

import "hatef/identity/v1/common.proto";

// IdentityService exposes low-latency identity and authorization primitives to
// trusted internal services. See api-design.md §2.2.
service IdentityService {
  // ValidateToken verifies an access JWT, shared authority, and optional DPoP.
  rpc ValidateToken(ValidateTokenRequest) returns (ValidateTokenResponse);

  // CheckPermission evaluates whether a user holds a specific permission (RBAC).
  rpc CheckPermission(CheckPermissionRequest) returns (CheckPermissionResponse);

  // GetInternalUserInfo fetches basic profile data needed by other services.
  rpc GetInternalUserInfo(GetInternalUserInfoRequest) returns (GetInternalUserInfoResponse);
}

message ValidateTokenRequest {
  string access_token = 1;
  // Required when the presented token is DPoP-bound (RFC 9449).
  string dpop_proof = 2;
  // Must be explicitly permitted by the authenticated workload's policy.
  string expected_audience = 3;
  // Original HTTP request context, independently observed by the caller.
  string http_method = 4;
  string http_uri = 5;
  // The observed Bearer or DPoP authorization scheme; not inferred from proof.
  string authorization_scheme = 6;
}

enum PrincipalType {
  PRINCIPAL_TYPE_UNSPECIFIED = 0;
  PRINCIPAL_TYPE_USER = 1;
  PRINCIPAL_TYPE_CLIENT = 2;
}

enum DpopOutcome {
  DPOP_OUTCOME_UNSPECIFIED = 0;
  DPOP_OUTCOME_INVALID_PROOF = 1;
  DPOP_OUTCOME_USE_NONCE = 2;
}

message ValidateTokenResponse {
  bool active = 1;
  // Populated only for an active user principal, never for a machine client.
  string user_id = 2;
  repeated string scopes = 3;
  string client_id = 4;
  int64 expires_at = 5;
  PrincipalType principal_type = 6;
  string subject = 7;
  // Inactive responses contain no identity claims. Nonce challenges contain
  // only this outcome and the nonce, and do not assert token revocation.
  DpopOutcome dpop_outcome = 8;
  string dpop_nonce = 9;
}

message CheckPermissionRequest {
  string user_id = 1;
  string permission = 2;
}

message CheckPermissionResponse {
  bool allowed = 1;
}

message GetInternalUserInfoRequest {
  string user_id = 1;
}

message GetInternalUserInfoResponse {
  string user_id = 1;
  // Empty for suspended/banned users; deleting/deleted users are not found.
  string email = 2;
  // Empty until an actual display-name field is implemented in storage.
  string display_name = 3;
  UserStatus status = 4;
}
