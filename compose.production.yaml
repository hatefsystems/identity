name: hatef-idp-production

x-api: &api
  image: ${API_IMAGE:?Set API_IMAGE to a versioned GHCR image or digest}
  platform: linux/amd64

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB:?Set POSTGRES_DB}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Set REDIS_PASSWORD}
    entrypoint: [/bin/sh, -ec]
    command: ['exec redis-server --appendonly yes --requirepass "$$REDIS_PASSWORD"']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: [-js, -sd, /data, -m, '8222']
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 5s
      timeout: 3s
      retries: 30

  # Operator runs this explicitly before starting the new API/web pair.
  migrate:
    <<: *api
    profiles: [operations]
    entrypoint: [/usr/local/bin/migrate]
    command: [up]
    restart: 'no'
    environment:
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set the schema-owner migration DSN}
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    environment:
      APP_ENV: production
      HOST: 0.0.0.0
      PORT: '8080'
      DATABASE_URL: ${DATABASE_URL:?Set the non-owner API DSN using postgres:5432}
      REDIS_URL: ${REDIS_URL:?Set REDIS_URL using redis:6379}
      NATS_URL: nats://nats:4222
      PORTAL_ORIGIN: ${PORTAL_ORIGIN:?Set the canonical HTTPS origin}
      OIDC_ISSUER: ${OIDC_ISSUER:?Set OIDC_ISSUER}
      WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID:?Set WEBAUTHN_RP_ID}
      WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS:?Set WEBAUTHN_RP_ORIGINS}
      OIDC_CLIENTS_JSON: ${OIDC_CLIENTS_JSON:?Set the approved OIDC client registry}
      ENVELOPE_MASTER_KEK: ${ENVELOPE_MASTER_KEK:?Set ENVELOPE_MASTER_KEK}
      ENVELOPE_MASTER_KEK_VERSION: ${ENVELOPE_MASTER_KEK_VERSION:-1}
      ENVELOPE_BLIND_INDEX_PEPPER: ${ENVELOPE_BLIND_INDEX_PEPPER:?Set ENVELOPE_BLIND_INDEX_PEPPER}
      ENVELOPE_BLIND_INDEX_PEPPER_VERSION: ${ENVELOPE_BLIND_INDEX_PEPPER_VERSION:-0}
      WEBAUTHN_MOCK_CHALLENGE_KEY: ${WEBAUTHN_MOCK_CHALLENGE_KEY:?Set WEBAUTHN_MOCK_CHALLENGE_KEY}
      STEPUP_REPLAY_HMAC_KEY: ${STEPUP_REPLAY_HMAC_KEY:?Set STEPUP_REPLAY_HMAC_KEY}
      OIDC_SIGNING_KEY_ACTIVE_PEM: ${OIDC_SIGNING_KEY_ACTIVE_PEM:?Set the private active OIDC key}
      OIDC_SIGNING_KEY_NEXT_PEM: ${OIDC_SIGNING_KEY_NEXT_PEM:?Set the private next OIDC key}
      OIDC_SIGNING_KEY_PREVIOUS_PEM: ${OIDC_SIGNING_KEY_PREVIOUS_PEM:-}
      # Activate optional capabilities with separately reviewed service overrides,
      # credentials and workers, as documented in the operations playbook.
      REGISTRATION_ENABLED: 'false'
      SMS_ENABLED: 'false'
      ADMIN_ENABLED: 'false'
      LEGAL_WORKFLOW_ENABLED: 'false'
      GRPC_ENABLED: 'false'
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:?Set the exact observed Nginx peer CIDR}
      SESSION_COOKIE_NAME: __Host-session
      SESSION_COOKIE_SECURE: 'true'
    ports:
      - '127.0.0.1:8080:8080'
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  web:
    image: ${WEB_IMAGE:?Set WEB_IMAGE to a versioned GHCR image or digest}
    platform: linux/amd64
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('node:http').get('http://127.0.0.1:3000/login',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

volumes:
  postgres:
  redis:
  nats:
