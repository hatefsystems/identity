name: Identity API

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: identity-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Generated code, tests, and static checks
    runs-on: ubuntu-24.04
    # Cold image/toolchain builds plus race/static gates exceeded the old margin locally.
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vet sqlc queries
        run: npm exec -- nx run identity-api:sqlc-vet --skipNxCache

      - name: Lint canonical protobuf contracts
        run: npm exec -- nx run schemas:lint --skipNxCache

      - name: Check generated-code reproducibility
        shell: bash
        run: |
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          snapshot=$(mktemp -d)
          cp -R apps/identity-api/internal/db "$snapshot/db"
          cp -R libs/schemas/gen "$snapshot/schemas"
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          diff -ru "$snapshot/db" apps/identity-api/internal/db
          diff -ru "$snapshot/schemas" libs/schemas/gen

      - name: Run fresh tests
        run: npm exec -- nx run identity-api:test --skipNxCache

      - name: Run race detector
        env:
          CGO_ENABLED: '1'
        run: npm exec -- nx run identity-api:test-race --skipNxCache

      - name: Run go vet
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Run golangci-lint
        run: npm exec -- nx run identity-api:lint --skipNxCache

      - name: Vet integration-tagged packages
        env:
          GOFLAGS: -tags=integration
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Lint integration-tagged packages
        run: npm exec -- nx run identity-api:lint --skipNxCache --args='--build-tags=integration'

      - name: Build identity API
        run: npm exec -- nx run identity-api:build --skipNxCache

      - name: Build admin operational commands
        run: npm exec -- nx run-many -t build-admin-audit-publisher,build-admin-roles,build-admin-legal -p identity-api --skipNxCache

      - name: Build lifecycle broadcast publisher
        run: npm exec -- nx run identity-api:build-lifecycle-publisher --skipNxCache

      - name: Build compatible signer, deletion and purge workers
        run: npm exec -- nx run-many -t build-audit-signer,build-purge-worker,build-security-ledger-purge,build-deletion-notifier -p identity-api --skipNxCache

      - name: Build non-root runtime image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/identity-api/Dockerfile --tag identity-api:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Smoke-test packaged maintenance entrypoints without credentials
        run: node .github/scripts/smoke-image.mjs api identity-api:ci

      - name: Export tested backend release image
        run: node .github/scripts/release-images.mjs export-candidate api identity-api:ci "$RUNNER_TEMP/release-api"

      - name: Upload tested backend release image
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-api
          path: ${{ runner.temp }}/release-api/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

  security-db-cells:
    name: security-db (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cell: [test-security-db, test-admin-integration, test-retention-integration, test-legal-workflow-integration, test-grpc-integration, test-lifecycle-integration, test-portal-integration]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum
      - name: Install workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Generate complete candidate schemas
        run: npm exec -- nx run schemas:generate --skipNxCache
      - name: Run bounded owned-service acceptance
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/acceptance
        run: npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --integration-target=${{ matrix.cell }}
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-db-${{ strategy.job-index }}
          path: ${{ runner.temp }}/acceptance/*.json
          if-no-files-found: error
          retention-days: 7

  security-db:
    name: Complete security-db release gate
    needs: [security-db-cells]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum
      - name: Install workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Download all cell reports
        uses: actions/download-artifact@v8
        with:
          pattern: security-db-*
          path: ${{ runner.temp }}/acceptance
          merge-multiple: true
      - name: Regenerate exact candidate artifacts
        run: |
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - name: Require every cell and matching final source
        env:
          CELL_RESULT: ${{ needs.security-db-cells.result }}
        run: |
          test "$CELL_RESULT" = success
          npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --aggregate-service "$RUNNER_TEMP/acceptance"

  security-race-cells:
    name: security-race (${{ matrix.cell }})
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        cell: [recovery, mfa, oidc/clientauth, adminaction, smsotp, registration, audit/signer]
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum
      - name: Install workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Generate complete candidate schemas
        run: npm exec -- nx run schemas:generate --skipNxCache
      - name: Run bounded owned-service acceptance
        env:
          ACCEPTANCE_REPORT_DIR: ${{ runner.temp }}/acceptance
        run: npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --integration-race-package=./internal/${{ matrix.cell }}
      - name: Upload sanitized acceptance evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-race-${{ strategy.job-index }}
          path: ${{ runner.temp }}/acceptance/*.json
          if-no-files-found: error
          retention-days: 7

  security-race:
    name: Complete security-race release gate
    needs: [security-race-cells]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum
      - name: Install workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Download all cell reports
        uses: actions/download-artifact@v8
        with:
          pattern: security-race-*
          path: ${{ runner.temp }}/acceptance
          merge-multiple: true
      - name: Regenerate exact candidate artifacts
        run: |
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - name: Require every cell and matching final source
        env:
          CELL_RESULT: ${{ needs.security-race-cells.result }}
        run: |
          test "$CELL_RESULT" = success
          npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --aggregate-race "$RUNNER_TEMP/acceptance"

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Test CI release and container policies
        run: npm exec -- nx exec -p schemas -- node --test "$GITHUB_WORKSPACE"/.github/scripts/*.test.mjs

      - name: Lint web and shared UI
        run: npm exec -- nx run-many -t lint -p web,ui --skipNxCache --args='--max-warnings=0'

      - name: Type-check shared UI
        run: npm exec -- nx run ui:typecheck --skipNxCache

      - name: Test shared UI
        run: npm exec -- nx run ui:test --skipNxCache --ci --runInBand --coverage

      - name: Test web
        run: npm exec -- nx run web:test --skipNxCache --ci --runInBand --coverage

      - name: Build production web app
        run: npm exec -- nx run web:build --skipNxCache

      # Nx 23.1.0 silently skips exec commands with --excludeTaskDependencies.
      - name: Type-check web and security tests
        run: npm exec -- nx exec -p web -- tsc --project "$GITHUB_WORKSPACE/apps/web/tsconfig.spec.json" --noEmit

      - name: Build non-root web image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/web/Dockerfile --tag identity-web:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Install Chromium for production CSP checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Smoke-test standalone web image and browser CSP
        env:
          WEB_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/auth-browser-evidence
        run: npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/web-csp.browser.mjs" identity-web:ci

      - name: Upload masked public and auth browser evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: auth-browser-evidence
          path: ${{ runner.temp }}/auth-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

      - name: Export tested web release image
        if: steps.image.outputs.release == 'true'
        run: node .github/scripts/release-images.mjs export web identity-web:ci "$RUNNER_TEMP/release-web"

      - name: Upload tested web release image
        if: steps.image.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: ${{ runner.temp }}/release-web/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            coverage/apps/web/
            libs/ui/test-output/jest/coverage/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  portal-browser:
    name: Real API production portal browser acceptance
    runs-on: ubuntu-24.04
    # Execute the complete real-service workflows independently for en and fa-IR.
    timeout-minutes: 70

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Validate test-only fixture safety
        run: npm exec -- nx run identity-api:test-portal-fixture --skipNxCache

      - name: Build production API, deletion notifier and excluded browser fixture
        run: npm exec -- nx run-many -t build,build-deletion-notifier,build-portal-fixture -p identity-api --skipNxCache

      - name: Build production portal
        run: npm exec -- nx run web:build --skipNxCache

      - name: Install Chromium virtual authenticator support
        run: npm exec -- playwright install --with-deps chromium

      # This suite owns ephemeral ports, uniquely named containers, fresh volumes,
      # a run-scoped database, and a local HTTPS ingress. No shared development DB
      # or public fixture endpoint is used. The image/CSP suite above stays intact.
      - name: Run real API portal browser suite
        env:
          PORTAL_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/portal-browser-evidence
        run: npm exec -- nx run web:test-portal-browser --skipNxCache

      - name: Upload sanitized portal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-browser-evidence
          path: ${{ runner.temp }}/portal-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  admin-browser:
    name: Real API admin browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 70

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Validate excluded fixture safety
        run: npm exec -- nx run identity-api:test-portal-fixture --skipNxCache

      - name: Install Chromium virtual authenticator support
        run: npm exec -- playwright install --with-deps chromium

      # The uncached target builds production Next/API/signer/publisher binaries,
      # then owns fresh services and an explicit test-only governance fixture.
      - name: Run real API admin browser suite
        env:
          ADMIN_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/admin-browser-evidence
        run: npm exec -- nx run web:test-admin-browser --skipNxCache

      - name: Upload sanitized admin evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-browser-evidence
          path: ${{ runner.temp }}/admin-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  registration-browser:
    name: Registration production browser prerequisite gate
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum
      - name: Install workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm ci
      - name: Download the quality-tested API candidate
        uses: actions/download-artifact@v8
        with:
          name: release-api
          path: ${{ runner.temp }}/release-api
      - name: Generate the candidate schema for identity verification
        run: |
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - name: Check public enrollment acceptance prerequisites
        run: node .github/scripts/registration-browser.mjs "$RUNNER_TEMP/release-api"

  publish:
    name: Publish release images
    needs: [quality, security-db, security-race, frontend, portal-browser, admin-browser, registration-browser]
    if: >-
      github.repository == 'hatefsystems/identity' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download this run's tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified versions and promote stable aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-images.mjs publish "$RUNNER_TEMP/release"
