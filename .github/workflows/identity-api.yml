name: Identity API

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: identity-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Generated code, tests, and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vet sqlc queries
        run: npm exec -- nx run identity-api:sqlc-vet --skipNxCache

      - name: Lint canonical protobuf contracts
        run: npm exec -- nx run schemas:lint --skipNxCache

      - name: Check generated-code reproducibility
        shell: bash
        run: |
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          snapshot=$(mktemp -d)
          cp -R apps/identity-api/internal/db "$snapshot/db"
          cp -R libs/schemas/gen/go "$snapshot/schema-go"
          cp -R libs/schemas/gen/ts "$snapshot/schema-ts"
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          diff -ru "$snapshot/db" apps/identity-api/internal/db
          diff -ru "$snapshot/schema-go" libs/schemas/gen/go
          diff -ru "$snapshot/schema-ts" libs/schemas/gen/ts

      - name: Run fresh tests
        run: npm exec -- nx run identity-api:test --skipNxCache

      - name: Run race detector
        env:
          CGO_ENABLED: '1'
        run: npm exec -- nx run identity-api:test-race --skipNxCache

      - name: Run go vet
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Run golangci-lint
        run: npm exec -- nx run identity-api:lint --skipNxCache

      - name: Vet integration-tagged packages
        env:
          GOFLAGS: -tags=integration
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Lint integration-tagged packages
        run: npm exec -- nx run identity-api:lint --skipNxCache --args='--build-tags=integration'

      - name: Build identity API
        run: npm exec -- nx run identity-api:build --skipNxCache

      - name: Build admin operational commands
        run: npm exec -- nx run-many -t build-admin-audit-publisher,build-admin-roles,build-admin-legal -p identity-api --skipNxCache

      - name: Build lifecycle broadcast publisher
        run: npm exec -- nx run identity-api:build-lifecycle-publisher --skipNxCache

      - name: Build compatible signer, deletion and purge workers
        run: npm exec -- nx run-many -t build-audit-signer,build-purge-worker,build-security-ledger-purge,build-deletion-notifier,build-registration-cleanup -p identity-api --skipNxCache --parallel=1

      - name: Build non-root runtime image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/identity-api/Dockerfile --tag identity-api:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Smoke-test packaged maintenance entrypoints without credentials
        run: node .github/scripts/smoke-image.mjs api identity-api:ci

      - name: Export exact tested API for all registration acceptance runs
        run: node .github/scripts/acceptance-report.mjs export-api identity-api:ci "$RUNNER_TEMP/acceptance-api"

      - name: Upload checksum-bound API acceptance artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: acceptance-api
          path: ${{ runner.temp }}/acceptance-api/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Export tested backend release image
        if: steps.image.outputs.release == 'true'
        run: node .github/scripts/release-images.mjs export api identity-api:ci "$RUNNER_TEMP/release-api"

      - name: Upload tested backend release image
        if: steps.image.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-api
          path: ${{ runner.temp }}/release-api/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

  integration-cell:
    name: Required suite ${{ matrix.target }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        target: [test-security-db, test-admin-integration, test-retention-integration, test-legal-workflow-integration, test-grpc-integration, test-lifecycle-integration, test-portal-integration]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Generate exact acceptance inputs
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client-16
          echo "/usr/lib/postgresql/16/bin" >> "$GITHUB_PATH"
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache

      - name: Run one allowlisted zero-skip suite with owned services
        env:
          INTEGRATION_ARTIFACT_DIR: ${{ runner.temp }}/integration-evidence
        run: npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --integration-target=${{ matrix.target }}

      - name: Upload truthful partial suite result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-${{ matrix.target }}
          path: ${{ runner.temp }}/integration-evidence/
          if-no-files-found: error
          retention-days: 7

  security-db:
    name: Exactly seven required integration suites
    needs: [integration-cell]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Prepare identical generated inputs
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: integration-test-*
          path: ${{ runner.temp }}/integration-evidence
          merge-multiple: true
          digest-mismatch: error
      - name: Require exact seven-source zero-skip aggregate
        run: node .github/scripts/acceptance-report.mjs aggregate integration "$RUNNER_TEMP/integration-evidence" "$RUNNER_TEMP/integration-aggregate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integration-aggregate
          path: ${{ runner.temp }}/integration-aggregate.json
          if-no-files-found: error
          retention-days: 7

  race-cell:
    name: Required race package ${{ matrix.package }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { package: './internal/recovery', artifact: recovery }
          - { package: './internal/mfa', artifact: mfa }
          - { package: './internal/oidc/clientauth', artifact: clientauth }
          - { package: './internal/adminaction', artifact: adminaction }
          - { package: './internal/smsotp', artifact: smsotp }
          - { package: './internal/registration', artifact: registration }
          - { package: './internal/audit/signer', artifact: signer }
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Prepare Linux CGO and generated acceptance inputs
        run: |
          gcc --version
          npm install --global npm@11.21.0
          npm ci
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - name: Run exact owned-service race package
        env:
          INTEGRATION_ARTIFACT_DIR: ${{ runner.temp }}/race-evidence
        run: npm exec -- nx exec -p schemas -- node "$GITHUB_WORKSPACE/.github/scripts/portal-harness.mjs" --integration-race-package=${{ matrix.package }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: race-${{ matrix.artifact }}
          path: ${{ runner.temp }}/race-evidence/
          if-no-files-found: error
          retention-days: 7

  security-race:
    name: Exactly seven affected race packages
    needs: [race-cell]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Prepare identical generated inputs
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: race-*
          path: ${{ runner.temp }}/race-evidence
          merge-multiple: true
          digest-mismatch: error
      - name: Require separate exact-seven race aggregate
        run: node .github/scripts/acceptance-report.mjs aggregate race "$RUNNER_TEMP/race-evidence" "$RUNNER_TEMP/race-aggregate.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: security-race-aggregate
          path: ${{ runner.temp }}/race-aggregate.json
          if-no-files-found: error
          retention-days: 7

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Test CI release and container policies
        run: npm exec -- nx exec -p schemas -- node --test "$GITHUB_WORKSPACE"/.github/scripts/*.test.mjs

      - name: Lint web and shared UI
        run: npm exec -- nx run-many -t lint -p web,ui --skipNxCache --args='--max-warnings=0'

      - name: Type-check shared UI
        run: npm exec -- nx run ui:typecheck --skipNxCache

      - name: Test shared UI
        run: npm exec -- nx run ui:test --skipNxCache --ci --runInBand --coverage

      - name: Test web
        run: npm exec -- nx run web:test --skipNxCache --ci --runInBand --coverage

      - name: Build production web app
        run: npm exec -- nx run web:build --skipNxCache

      # Nx 23.1.0 silently skips exec commands with --excludeTaskDependencies.
      - name: Type-check web and security tests
        run: npm exec -- nx exec -p web -- tsc --project "$GITHUB_WORKSPACE/apps/web/tsconfig.spec.json" --noEmit

      - name: Build non-root web image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/web/Dockerfile --tag identity-web:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Install Chromium for production CSP checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Smoke-test standalone web image and browser CSP
        run: npm exec -- nx exec -p web -- node "$GITHUB_WORKSPACE/.github/scripts/web-csp.browser.mjs" identity-web:ci

      - name: Export tested web release image
        if: steps.image.outputs.release == 'true'
        run: node .github/scripts/release-images.mjs export web identity-web:ci "$RUNNER_TEMP/release-web"

      - name: Upload tested web release image
        if: steps.image.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: ${{ runner.temp }}/release-web/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            coverage/apps/web/
            libs/ui/test-output/jest/coverage/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  portal-browser:
    name: Real API production portal browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Validate test-only fixture safety
        run: npm exec -- nx run identity-api:test-portal-fixture --skipNxCache

      - name: Build production API, deletion notifier and excluded browser fixture
        run: npm exec -- nx run-many -t build,build-deletion-notifier,build-portal-fixture -p identity-api --skipNxCache

      - name: Build production portal
        run: npm exec -- nx run web:build --skipNxCache

      - name: Install Chromium virtual authenticator support
        run: npm exec -- playwright install --with-deps chromium

      # This suite owns ephemeral ports, uniquely named containers, fresh volumes,
      # a run-scoped database, and a local HTTPS ingress. No shared development DB
      # or public fixture endpoint is used. The image/CSP suite above stays intact.
      - name: Run real API portal browser suite
        env:
          PORTAL_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/portal-browser-evidence
        run: npm exec -- nx run web:test-portal-browser --skipNxCache

      - name: Upload sanitized portal evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: portal-browser-evidence
          path: ${{ runner.temp }}/portal-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  admin-browser:
    name: Real API admin browser acceptance
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Validate excluded fixture safety
        run: npm exec -- nx run identity-api:test-portal-fixture --skipNxCache

      - name: Install Chromium virtual authenticator support
        run: npm exec -- playwright install --with-deps chromium

      # The uncached target builds production Next/API/signer/publisher binaries,
      # then owns fresh services and an explicit test-only governance fixture.
      - name: Run real API admin browser suite
        env:
          ADMIN_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/admin-browser-evidence
        run: npm exec -- nx run web:test-admin-browser --skipNxCache

      - name: Upload sanitized admin evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: admin-browser-evidence
          path: ${{ runner.temp }}/admin-browser-evidence/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  registration-browser:
    name: Exact release API production registration acceptance
    needs: [quality]
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
      - name: Prepare identical generated inputs and browser
        run: |
          npm install --global npm@11.21.0
          npm ci
          npm exec -- nx run schemas:generate --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          npm exec -- playwright install --with-deps chromium
      - name: Preload declared registration controller and isolated service images
        run: |
          docker pull --platform linux/amd64 node:24-bookworm-slim
          docker pull --platform linux/amd64 postgres:16-alpine
          docker pull --platform linux/amd64 redis:7-alpine
          docker pull --platform linux/amd64 nats:2.10-alpine
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-api
          path: ${{ runner.temp }}/acceptance-api
          digest-mismatch: error
      - name: Load exact checksum-verified API and run production browser
        env:
          REGISTRATION_BROWSER_ARTIFACT_DIR: ${{ runner.temp }}/registration-browser-evidence
          REGISTRATION_BROWSER_API_MANIFEST: ${{ runner.temp }}/acceptance-api/acceptance-api.json
        run: |
          export REGISTRATION_BROWSER_CONTROLLER_IMAGE="$(docker image inspect --format '{{.Id}}' node:24-bookworm-slim)"
          export REGISTRATION_BROWSER_API_IMAGE="$(node .github/scripts/acceptance-report.mjs load-api "$RUNNER_TEMP/acceptance-api")"
          npm exec -- nx run web:test-registration-browser --skipNxCache
          node .github/scripts/acceptance-report.mjs verify-registration "$RUNNER_TEMP/registration-browser-evidence/registration-evidence.json" "$RUNNER_TEMP/acceptance-api/acceptance-api.json"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: registration-browser-evidence
          path: ${{ runner.temp }}/registration-browser-evidence/
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish release images
    needs: [quality, security-db, security-race, frontend, portal-browser, admin-browser, registration-browser]
    if: >-
      github.repository == 'hatefsystems/identity' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download this run's tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Download registration source/image binding
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: registration-browser-evidence
          path: ${{ runner.temp }}/registration-browser-evidence
          digest-mismatch: error
      - name: Download acceptance image manifest
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: acceptance-api
          path: ${{ runner.temp }}/acceptance-api
          digest-mismatch: error
      - name: Download integration publication aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: integration-aggregate
          path: ${{ runner.temp }}/aggregates
          digest-mismatch: error
      - name: Download race publication aggregate
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: security-race-aggregate
          path: ${{ runner.temp }}/aggregates
          digest-mismatch: error
      - name: Bind all acceptance reports to published API
        run: node .github/scripts/acceptance-report.mjs verify-publication "$RUNNER_TEMP/registration-browser-evidence/registration-evidence.json" "$RUNNER_TEMP/acceptance-api/acceptance-api.json" "$RUNNER_TEMP/release/api.json" "$RUNNER_TEMP/aggregates"

      - name: Publish verified versions and promote stable aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-images.mjs publish "$RUNNER_TEMP/release"
