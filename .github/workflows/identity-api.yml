name: Identity API

on:
  pull_request:
    paths:
      - 'apps/identity-api/**'
      - '.env.example'
      - 'nx.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/identity-api.yml'
  push:
    paths:
      - 'apps/identity-api/**'
      - '.env.example'
      - 'nx.json'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/identity-api.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: identity-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Generated code, tests, and static checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/identity-api/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11
          npm --version
          npm ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vet sqlc queries
        run: npm exec -- nx run identity-api:sqlc-vet --skipNxCache

      - name: Check generated-code reproducibility
        shell: bash
        run: |
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          snapshot=$(mktemp -d)
          cp -R apps/identity-api/internal/db "$snapshot/db"
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          diff -ru "$snapshot/db" apps/identity-api/internal/db

      - name: Run fresh tests
        run: npm exec -- nx run identity-api:test --skipNxCache

      - name: Run race detector
        run: npm exec -- nx run identity-api:test-race --skipNxCache

      - name: Run go vet
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Run golangci-lint
        run: npm exec -- nx run identity-api:lint --skipNxCache

      - name: Build identity API
        run: npm exec -- nx run identity-api:build --skipNxCache

      - name: Build admin operational commands
        run: npm exec -- nx run-many -t build-admin-audit-publisher,build-admin-roles,build-admin-legal -p identity-api --skipNxCache

      - name: Build compatible signer and purge workers
        run: npm exec -- nx run-many -t build-audit-signer,build-purge-worker,build-security-ledger-purge -p identity-api --skipNxCache

      - name: Build non-root runtime image
        run: docker build --tag identity-api:ci apps/identity-api

      - name: Smoke-test packaged maintenance entrypoints without credentials
        shell: bash
        run: |
          image=$(docker image inspect --format '{{.Id}}' identity-api:ci)
          test "$(docker image inspect --format '{{.Config.User}}' "$image")" = 'nonroot:nonroot'
          for binary in security-ledger-purge admin-audit-publisher admin-legal; do
            status=0
            output=$(docker run --rm --network none --entrypoint "/usr/local/bin/$binary" "$image" 2>&1) || status=$?
            printf '%s\n' "$output"
            test "$status" -eq 1
            printf '%s\n' "$output" | grep -q '"level":"ERROR"'
          done

  security-db:
    name: PostgreSQL security integration tests
    runs-on: ubuntu-latest
    # Includes the serial legal-workflow and real-role suites; local runs of the
    # complete sequence exceed the former 20-minute budget.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity_test_password
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://identity:identity_test_password@127.0.0.1:5432/identity?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      NATS_URL: nats://127.0.0.1:4222

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: apps/identity-api/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11
          npm --version
          npm ci

      - name: Start disposable NATS JetStream
        run: docker run --detach --name admin-test-nats --publish 127.0.0.1:4222:4222 nats:2.10-alpine -js

      - name: Run serial database security tests
        run: npm exec -- nx run identity-api:test-security-db --skipNxCache

      - name: Run mandatory admin and audit integration tests
        run: npm exec -- nx run identity-api:test-admin-integration --skipNxCache

      # Serial with the other suites: migration fixtures reset the shared schema.
      - name: Run mandatory retention and real-role integration tests
        run: npm exec -- nx run identity-api:test-retention-integration --skipNxCache

      - name: Run mandatory legal workflow and transparency integration tests
        run: npm exec -- nx run identity-api:test-legal-workflow-integration --skipNxCache
