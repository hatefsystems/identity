name: Identity API

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

env:
  CI: 'true'
  NX_DAEMON: 'false'
  NEXT_TELEMETRY_DISABLED: '1'

concurrency:
  group: identity-api-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  quality:
    name: Generated code, tests, and static checks
    runs-on: ubuntu-24.04
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Install golangci-lint
        run: |
          go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.12.2
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Vet sqlc queries
        run: npm exec -- nx run identity-api:sqlc-vet --skipNxCache

      - name: Lint canonical protobuf contracts
        run: npm exec -- nx run schemas:lint --skipNxCache

      - name: Check generated-code reproducibility
        shell: bash
        run: |
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          snapshot=$(mktemp -d)
          cp -R apps/identity-api/internal/db "$snapshot/db"
          cp -R libs/schemas/gen/go "$snapshot/schema-go"
          npm exec -- nx run schemas:generate-go --skipNxCache
          npm exec -- nx run identity-api:sqlc-generate --skipNxCache
          diff -ru "$snapshot/db" apps/identity-api/internal/db
          diff -ru "$snapshot/schema-go" libs/schemas/gen/go

      - name: Run fresh tests
        run: npm exec -- nx run identity-api:test --skipNxCache

      - name: Run race detector
        env:
          CGO_ENABLED: '1'
        run: npm exec -- nx run identity-api:test-race --skipNxCache

      - name: Run go vet
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Run golangci-lint
        run: npm exec -- nx run identity-api:lint --skipNxCache

      - name: Vet integration-tagged packages
        env:
          GOFLAGS: -tags=integration
        run: npm exec -- nx run identity-api:vet --skipNxCache

      - name: Lint integration-tagged packages
        run: npm exec -- nx run identity-api:lint --skipNxCache --args='--build-tags=integration'

      - name: Build identity API
        run: npm exec -- nx run identity-api:build --skipNxCache

      - name: Build admin operational commands
        run: npm exec -- nx run-many -t build-admin-audit-publisher,build-admin-roles,build-admin-legal -p identity-api --skipNxCache

      - name: Build lifecycle broadcast publisher
        run: npm exec -- nx run identity-api:build-lifecycle-publisher --skipNxCache

      - name: Build compatible signer and purge workers
        run: npm exec -- nx run-many -t build-audit-signer,build-purge-worker,build-security-ledger-purge -p identity-api --skipNxCache

      - name: Build non-root runtime image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/identity-api/Dockerfile --tag identity-api:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Smoke-test packaged maintenance entrypoints without credentials
        run: node .github/scripts/smoke-image.mjs api identity-api:ci

      - name: Export tested backend release image
        if: steps.image.outputs.release == 'true'
        run: node .github/scripts/release-images.mjs export api identity-api:ci "$RUNNER_TEMP/release-api"

      - name: Upload tested backend release image
        if: steps.image.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-api
          path: ${{ runner.temp }}/release-api/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

  security-db:
    name: PostgreSQL security integration tests
    runs-on: ubuntu-24.04
    # Includes the serial legal-workflow and real-role suites; local runs of the
    # complete sequence exceed the former 20-minute budget.
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: identity
          POSTGRES_PASSWORD: identity_test_password
          POSTGRES_DB: identity
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U identity -d identity"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgres://identity:identity_test_password@127.0.0.1:5432/identity?sslmode=disable
      REDIS_URL: redis://127.0.0.1:6379/0
      NATS_URL: nats://127.0.0.1:4222

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Set up Go 1.26
        uses: actions/setup-go@v7
        with:
          go-version: '1.26.x'
          cache-dependency-path: |
            apps/identity-api/go.sum
            libs/schemas/go.sum

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Start disposable NATS JetStream
        run: |
          docker run --detach --name admin-test-nats --label ldp.task=6.3 \
            --publish 127.0.0.1:4222:4222 --publish 127.0.0.1:8222:8222 \
            nats:2.10-alpine -js -sd /data -m 8222
          curl --fail --silent --show-error --retry 30 --retry-delay 1 \
            --retry-connrefused --max-time 2 --retry-max-time 60 \
            'http://127.0.0.1:8222/healthz?js-enabled-only=true'

      - name: Run serial database security tests
        run: npm exec -- nx run identity-api:test-security-db --skipNxCache

      - name: Run mandatory admin and audit integration tests
        run: npm exec -- nx run identity-api:test-admin-integration --skipNxCache

      # Serial with the other suites: migration fixtures reset the shared schema.
      - name: Run mandatory retention and real-role integration tests
        run: npm exec -- nx run identity-api:test-retention-integration --skipNxCache

      - name: Run mandatory legal workflow and transparency integration tests
        run: npm exec -- nx run identity-api:test-legal-workflow-integration --skipNxCache

      - name: Run mandatory gRPC and shared-credential integration tests
        run: npm exec -- nx run identity-api:test-grpc-integration --skipNxCache

      - name: Run mandatory lifecycle broadcast integration tests
        env:
          LIFECYCLE_TEST_NATS_CONTAINER: admin-test-nats
        run: npm exec -- nx run identity-api:test-lifecycle-integration --skipNxCache

      - name: Collect disposable service diagnostics
        if: failure()
        env:
          POSTGRES_CONTAINER: ${{ job.services.postgres.id }}
          REDIS_CONTAINER: ${{ job.services.redis.id }}
        run: |
          docker logs "$POSTGRES_CONTAINER" || true
          docker logs "$REDIS_CONTAINER" || true
          docker logs admin-test-nats || true

      - name: Remove disposable NATS container
        if: always()
        run: docker rm --force admin-test-nats || true

  frontend:
    name: Frontend checks and build
    runs-on: ubuntu-24.04
    timeout-minutes: 25

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm

      - name: Validate image metadata
        id: image
        run: node .github/scripts/release-images.mjs metadata

      - name: Set up npm 11 and workspace dependencies
        run: |
          npm install --global npm@11.21.0
          npm --version
          npm ci

      - name: Test CI release and container policies
        run: npm exec -- nx exec -p schemas -- node --test "$GITHUB_WORKSPACE"/.github/scripts/*.test.mjs

      - name: Lint web and shared UI
        run: npm exec -- nx run-many -t lint -p web,ui --skipNxCache

      - name: Type-check shared UI
        run: npm exec -- nx run ui:typecheck --skipNxCache

      - name: Test shared UI
        run: npm exec -- nx run ui:test --skipNxCache --ci --runInBand --coverage

      - name: Test web
        run: npm exec -- nx run web:test --skipNxCache --ci --runInBand --coverage

      - name: Build production web app
        run: npm exec -- nx run web:build --skipNxCache

      # Nx 23.1.0 silently skips exec commands with --excludeTaskDependencies.
      - name: Type-check web and security tests
        run: npm exec -- nx exec -p web -- tsc --project "$GITHUB_WORKSPACE/apps/web/tsconfig.spec.json" --noEmit

      - name: Build non-root web image
        env:
          IMAGE_SOURCE: ${{ steps.image.outputs.source }}
          IMAGE_REVISION: ${{ steps.image.outputs.revision }}
          IMAGE_VERSION: ${{ steps.image.outputs.version }}
        run: >-
          docker build --platform linux/amd64
          --file apps/web/Dockerfile --tag identity-web:ci
          --label "org.opencontainers.image.source=$IMAGE_SOURCE"
          --label "org.opencontainers.image.revision=$IMAGE_REVISION"
          --label "org.opencontainers.image.version=$IMAGE_VERSION" .

      - name: Install Chromium for production CSP checks
        run: npm exec -- playwright install --with-deps chromium

      - name: Smoke-test standalone web image and browser CSP
        run: npm exec -- nx exec -p web -- node "$GITHUB_WORKSPACE/.github/scripts/web-csp.browser.mjs" identity-web:ci

      - name: Export tested web release image
        if: steps.image.outputs.release == 'true'
        run: node .github/scripts/release-images.mjs export web identity-web:ci "$RUNNER_TEMP/release-web"

      - name: Upload tested web release image
        if: steps.image.outputs.release == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-web
          path: ${{ runner.temp }}/release-web/
          if-no-files-found: error
          retention-days: 3
          compression-level: 1
          overwrite: true

      - name: Upload frontend coverage
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: frontend-coverage
          path: |
            coverage/apps/web/
            libs/ui/test-output/jest/coverage/
          if-no-files-found: ignore
          retention-days: 7
          overwrite: true

  publish:
    name: Publish release images
    needs: [quality, security-db, frontend]
    if: >-
      github.repository == 'hatefsystems/identity' &&
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    concurrency:
      group: ghcr-release-${{ github.repository }}
      cancel-in-progress: false

    steps:
      - name: Check out tested commit
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          package-manager-cache: false

      - name: Download this run's tested images
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: release-*
          path: ${{ runner.temp }}/release
          merge-multiple: true
          digest-mismatch: error

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish verified versions and promote stable aliases
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/release-images.mjs publish "$RUNNER_TEMP/release"
