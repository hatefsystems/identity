name: hatef-idp-local

x-api: &api
  image: hatef-idp-api:local
  build:
    context: .
    dockerfile: apps/identity-api/Dockerfile
    target: local
  platform: linux/amd64

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: identity
      POSTGRES_PASSWORD: identity_local_only
      POSTGRES_DB: identity
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U identity -d identity']
      interval: 3s
      timeout: 3s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: [redis-server, --appendonly, 'yes']
    volumes:
      - redis:/data
    healthcheck:
      test: [CMD, redis-cli, ping]
      interval: 3s
      timeout: 3s
      retries: 30

  nats:
    image: nats:2.10-alpine
    restart: unless-stopped
    command: [-js, -sd, /data, -m, '8222']
    volumes:
      - nats:/data
    healthcheck:
      test: [CMD-SHELL, 'wget -q -O - http://127.0.0.1:8222/healthz | grep -q ok']
      interval: 3s
      timeout: 3s
      retries: 30

  init:
    <<: *api
    user: '0:0'
    entrypoint: [/bin/sh, /opt/local/bootstrap.sh]
    restart: 'no'
    volumes:
      - keys:/run/local-keys
      - tls:/run/local-tls

  migrate:
    <<: *api
    entrypoint: [/usr/local/bin/migrate]
    command: [up]
    restart: 'no'
    environment:
      DATABASE_URL: postgres://identity:identity_local_only@postgres:5432/identity?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    <<: *api
    restart: unless-stopped
    environment:
      APP_ENV: development
      HOST: 0.0.0.0
      PORT: '8080'
      PORTAL_ORIGIN: https://localhost:8443
      OIDC_ISSUER: https://localhost:8443
      WEBAUTHN_RP_ID: localhost
      WEBAUTHN_RP_ORIGINS: https://localhost:8443
      DATABASE_URL: postgres://identity:identity_local_only@postgres:5432/identity?sslmode=disable
      REDIS_URL: redis://redis:6379/0
      NATS_URL: nats://nats:4222
      SESSION_COOKIE_NAME: __Host-session
      SESSION_COOKIE_SECURE: 'true'
      # Only ingress is attached to this small, dedicated proxy network.
      TRUSTED_PROXY_CIDRS: 172.30.84.2/32
      REGISTRATION_ENABLED: 'false'
      SMS_ENABLED: 'false'
      ADMIN_ENABLED: 'false'
      GRPC_ENABLED: 'false'
    volumes:
      - keys:/run/local-keys:ro
    networks:
      default: {}
      ingress:
        ipv4_address: 172.30.84.3
    depends_on:
      init:
        condition: service_completed_successfully
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      nats:
        condition: service_healthy
    healthcheck:
      test: [CMD, /usr/local/bin/healthcheck]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  web:
    image: hatef-idp-web:local
    platform: linux/amd64
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    restart: unless-stopped
    networks:
      ingress:
        ipv4_address: 172.30.84.4
    healthcheck:
      test:
        [
          CMD,
          node,
          -e,
          "require('node:http').get('http://127.0.0.1:3000/login',r=>{r.resume();process.exit(r.statusCode===200?0:1)}).on('error',()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 4s
      retries: 30
      start_period: 10s

  ingress:
    image: nginx:1.28-alpine
    restart: unless-stopped
    ports:
      - '127.0.0.1:8443:443'
    volumes:
      - ./tools/docker/nginx.local.conf:/etc/nginx/conf.d/default.conf:ro
      - ./tools/docker/proxy-headers.conf:/etc/nginx/proxy-headers.conf:ro
      - tls:/run/local-tls:ro
    networks:
      edge: {}
      ingress:
        ipv4_address: 172.30.84.2
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1:8081/healthz']
      interval: 3s
      timeout: 3s
      retries: 30
    depends_on:
      init:
        condition: service_completed_successfully
      api:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres:
  redis:
  nats:
  keys:
  tls:

networks:
  edge: {}
  ingress:
    internal: true
    ipam:
      config:
        - subnet: 172.30.84.0/29
