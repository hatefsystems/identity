# No raw request URLs, query strings, headers or bodies in proxy diagnostics.
access_log off;
error_log /dev/null crit;
resolver 127.0.0.11 valid=10s ipv6=off;
upstream identity_api { zone identity_api 64k; server api:8080 resolve; }
upstream identity_web { zone identity_web 64k; server web:3000 resolve; }
server {
    listen 127.0.0.1:8081;
    location = /healthz { return 200; }
}
server {
    listen 443 ssl;
    server_name localhost;
    if ($http_host != 'localhost:8443') { return 421; }
    ssl_certificate /run/local-tls/localhost.crt;
    ssl_certificate_key /run/local-tls/localhost.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/proxy-headers.conf;
    location = /oauth2/authorize { proxy_pass http://identity_web; }
    location = /oauth2/error { proxy_pass http://identity_web; }
    location ~ ^/(api|oauth2|\.well-known)(/|$) { proxy_pass http://identity_api; }
    location = /healthz { proxy_pass http://identity_api; }
    location = /readyz { proxy_pass http://identity_api; }
    location / { proxy_pass http://identity_web; }
}
